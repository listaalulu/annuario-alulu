document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lc(100% + 10px); right:0;\n  background:linear-gradient(160deg,#0D1E3A 0%,#162C52 100%);\n  border:1px solid rgba(242,229,210,.14);\n  border-radius:16px; padding:8px 6px 10px;\n  min-width:230px; max-height:440px; overflow-y:auto;\n  box-shadow:0 28px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(197,39,36,.12);\n  animation:panelDown .16s ease; z-index:200;\n  scrollbar-width:thin; scrollbar-color:rgba(242,229,210,.15) transparent;\n}\n.cls-panel::-webkit-scrollbar { width:4px; }\n.cls-panel::-webkit-scrollbar-thumb { background:rgba(242,229,210,.18); border-radius:4px; }\n@keyframes panelDown { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }\n.cls-yr {\n  font-family:'Oswald',sans-serif; font-size:10px;\n  font-weight:600; letter-spacing:.2em; text-transform:uppercase;\n  color:#C52724; padding:10px 10px 4px; display:flex; align-items:center; gap:6px;\n}\n.cls-yr::after { content:''; flex:1; height:1px; background:rgba(197,39,36,.2); }\n.cls-lnk {\n  display:flex; align-items:center; justify-content:space-between;\n  padding:9px 10px; border-radius:10px;\n  color:#FAF3E6; text-decoration:none; font-size:13.5px;\n  transition:background .12s;\n}\n.cls-lnk:hover { background:rgba(242,229,210,.09); }\n.cls-badge {\n  background:rgba(197,39,36,.22); color:#E89B98;\n  font-size:11px; font-weight:700; padding:2px 9px;\n  border-radius:99px; margin-left:10px; flex-shrink:0;\n}\n\n@media (max-width: 640px) {\n  .hero-sec { padding: 88px 20px 32px !important; }\n  .hero-toolbar {\n    position: static !important;\n    top: auto !important; right: auto !important;\n    display: flex !important; flex-wrap: wrap !important;\n    gap: 8px !important; margin: 0 0 22px !important;\n  }\n  .hero-toolbar button, .hero-toolbar .cls-picker { flex: 0 0 auto; }\n  .main-wrap { padding: 32px 16px 0 !important; }\n  .card-head { flex-wrap: wrap !important; padding: 16px 18px !important; }\n  .photos-card { padding: 16px 16px 20px !important; }\n  .footer-wrap { padding: 0 16px !important; }\n  .footer-cta { padding: 32px 24px !important; }\n}\n\u003C/style>\n\u003C/helmet>\n\n\n\n\u003Cdiv style=\"display:flex;min-height:100vh;background:#F2E5D2;color:#221E1A;font-family:'Libre Franklin',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.6;\">\n\n    \u003C!-- ══════════ MAIN ══════════ -->\n  \u003Cmain style=\"flex:1;min-width:0;\">\n\n    \u003C!-- HERO -->\n    \u003Csection class=\"hero-sec\" style=\"position:relative;background:#17335D;background-image:linear-gradient(135deg,#11264A 0%,#17335D 55%,#21437a 100%);padding:64px 56px 88px;\">\n      \u003Cdiv style=\"position:absolute;inset:0;overflow:hidden;pointer-events:none;\">\n        \u003Cdiv style=\"position:absolute;inset:0;opacity:.5;background-image:radial-gradient(rgba(242,229,210,.07) 1.2px,transparent 1.5px);background-size:22px 22px;\">\u003C/div>\n        \u003Cdiv style=\"position:absolute;right:-40px;top:-30px;font-family:'Oswald',sans-serif;font-size:240px;font-weight:700;color:rgba(197,39,36,.12);line-height:1;\">★\u003C/div>\n      \u003C/div>\n      \u003Cdiv style=\"position:relative;max-width:680px;\">\n        \u003Cdiv style=\"display:inline-flex;align-items:center;gap:9px;font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#E89B98;margin-bottom:18px;\">\u003Cspan style=\"color:#C52724;\">★ ★ ★\u003C/span> Annuario Fotografico\u003C/div>\n        \u003Ch1 style=\"font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(34px,5.5vw,58px);line-height:1.02;text-transform:uppercase;color:#FAF3E6;margin:0 0 18px;\">{{ schoolName }}\u003C/h1>\n        \u003Cp style=\"font-size:16.5px;color:#B9C5DA;max-width:520px;margin:0;\">Tutti i ricordi dell'anno scolastico {{ schoolYear }} in un unico spazio. Sfoglia le classi, esplora i volti e conserva i momenti più importanti.\u003C/p>\n        \n      \u003C/div>\n      \u003C!-- TOP-RIGHT TOOLBAR -->\n      \u003Cdiv class=\"hero-toolbar\" style=\"position:absolute;top:22px;right:28px;display:flex;align-items:center;gap:10px;z-index:10;\">\n\n        \u003C!-- Scarica l'annuario -->\n        \u003Cbutton onclick=\"{{ download }}\" style=\"position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:9px;background:#C52724;color:#FAF3E6;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 22px;border:none;border-radius:999px;cursor:pointer;white-space:nowrap;box-shadow:0 3px 16px rgba(197,39,36,.45);\">\n          \u003Cdiv style=\"{{ downloadBarStyle }}\">\u003C/div>\n          \u003Csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:relative;\">\u003Cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003Cpolyline points=\"7 10 12 15 17 10\"/>\u003Cline x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/>\u003C/svg>\n          \u003Cspan style=\"position:relative;\">{{ toolbarDownloadLabel }}\u003C/span>\n        \u003C/button>\n\n        \u003C!-- Foto extra -->\n        \u003Cbutton onclick=\"{{ gotoExtra }}\" style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1.5px solid rgba(242,229,210,.3);color:#FAF3E6;font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\">\n          \u003Csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003Crect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/>\u003Ccircle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/>\u003Cpath d=\"M21 15l-5-5L5 21\"/>\u003C/svg>\n          Foto Extra\n        \u003C/button>\n\n        \u003C!-- Ultimo giorno -->\n        \u003Cbutton onclick=\"{{ gotoLastDay }}\" style=\"display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);border:1.5px solid rgba(242,229,210,.3);color:#FAF3E6;font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;border-radius:999px;cursor:pointer;white-space:nowrap;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\">\n          \u003Csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003Cpath d=\"M12 2v4\"/>\u003Cpath d=\"m6.4 6.4 2.8 2.8\"/>\u003Cpath d=\"M2 14h4\"/>\u003Cpath d=\"m6.4 21.6 2.8-2.8\"/>\u003Cpath d=\"M14 22v-4\"/>\u003Cpath d=\"m17.6 19.4-2.8-2.8\"/>\u003Cpath d=\"M22 14h-4\"/>\u003Cpath d=\"m17.6 8.6-2.8 2.8\"/>\u003C/svg>\n          Ultimo Giorno\n        \u003C/button>\n\n        \u003C!-- Classe picker -->\n        \u003Cdetails class=\"cls-picker\" id=\"cls-picker\">\n          \u003Csummary>\n            \u003Csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003Crect x=\"3\" y=\"3\" width=\"7\" height=\"7\"/>\u003Crect x=\"14\" y=\"3\" width=\"7\" height=\"7\"/>\u003Crect x=\"3\" y=\"14\" width=\"7\" height=\"7\"/>\u003Crect x=\"14\" y=\"14\" width=\"7\" height=\"7\"/>\u003C/svg>\n            Vai alla classe\n            \u003Csvg class=\"chev\" width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\">\u003Cpolyline points=\"6 9 12 15 18 9\"/>\u003C/svg>\n          \u003C/summary>\n          \u003Cdiv class=\"cls-panel\" id=\"cls-panel\">\n            \u003Csc-for list=\"{{ navGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n              \u003Cdiv>\n                \u003Cdiv class=\"cls-yr\">{{ grp.yearLabel }}\u003C/div>\n                \u003Csc-for list=\"{{ grp.classes }}\" as=\"cls\" hint-placeholder-count=\"2\">\n                  \u003Ca href=\"{{ cls.href }}\" onclick=\"{{ cls.goto }}\" class=\"cls-lnk\">\n                    \u003Cspan>Classe {{ cls.label }}\u003C/span>\n                    \u003Cspan class=\"cls-badge\">{{ cls.count }}\u003C/span>\n                  \u003C/a>\n                \u003C/sc-for>\n              \u003C/div>\n            \u003C/sc-for>\n          \u003C/div>\n        \u003C/details>\n\n      \u003C/div>\n    \u003C/section>\n\n    \u003C!-- CLASSI -->\n    \u003Cdiv class=\"main-wrap\" style=\"padding:44px 56px 0;\">\n      \u003Csc-for list=\"{{ navGroups }}\" as=\"grp\" hint-placeholder-count=\"3\">\n        \u003Cdiv style=\"display:flex;align-items:center;gap:16px;margin:48px 0 26px;\">\n          \u003Cspan style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;text-transform:uppercase;color:#17335D;white-space:nowrap;\">{{ grp.yearLabel }}\u003C/span>\n          \u003Cspan style=\"flex:1;height:2px;background:repeating-linear-gradient(to right,#E3D6BF 0 8px,transparent 8px 14px);\">\u003C/span>\n          \u003Cspan style=\"font-family:'Oswald',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#A8966f;\">{{ grp.countLabel }}\u003C/span>\n        \u003C/div>\n\n        \u003Csc-for list=\"{{ grp.classes }}\" as=\"cls\" hint-placeholder-count=\"2\">\n          \u003Csection id=\"{{ cls.id }}\" style=\"background:#FFFFFF;border:1px solid #E3D6BF;border-radius:14px;box-shadow:0 4px 18px rgba(17,38,74,.07);overflow:hidden;margin-bottom:36px;scroll-margin-top:24px;\">\n            \u003Cdiv class=\"card-head\" style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 26px;border-bottom:1px solid #F0E7D4;\">\n              \u003Cdiv style=\"display:flex;align-items:center;gap:14px;\">\n                \u003Cdiv style=\"width:46px;height:46px;border-radius:10px;background:#17335D;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;color:#FAF3E6;flex-shrink:0;\">{{ cls.id }}\u003C/div>\n                \u003Cdiv>\n                  \u003Cdiv style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:20px;text-transform:uppercase;color:#17335D;line-height:1.1;\">Classe {{ cls.label }}\u003C/div>\n                  \u003Cdiv style=\"font-size:12.5px;color:#8a7a5e;margin-top:2px;\">{{ cls.sub }}\u003C/div>\n                \u003C/div>\n              \u003C/div>\n              \u003Cdiv style=\"display:flex;gap:8px;\">\n                \u003Cspan style=\"font-family:'Oswald',sans-serif;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(23,51,93,.08);color:#17335D;\">{{ cls.yearLabel }}\u003C/span>\n                \u003Cspan style=\"font-family:'Oswald',sans-serif;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:5px 12px;border-radius:999px;background:rgba(197,39,36,.1);color:#A41E1C;\">Sez. {{ cls.section }}\u003C/span>\n              \u003C/div>\n            \u003C/div>\n\n            \u003Cdiv onclick=\"{{ cls.openHero }}\" style=\"position:relative;overflow:hidden;cursor:zoom-in;background:#F0E7D4;\">\n              \u003Cimg src=\"{{ cls.heroPhoto.src }}\" alt=\"{{ cls.heroPhoto.alt }}\" loading=\"lazy\" style=\"width:100%;max-height:520px;aspect-ratio:3/2;object-fit:contain;display:block;margin:0 auto;\">\n              \u003Cdiv style=\"position:absolute;inset:0;display:flex;align-items:flex-end;padding:22px 26px;background:linear-gradient(to top,rgba(17,38,74,.6),transparent 55%);opacity:0;transition:opacity .25s;\" style-hover=\"opacity:1;\">\n                \u003Cspan style=\"display:inline-flex;align-items:center;gap:8px;color:#FAF3E6;font-size:14px;font-weight:500;\">\u003Csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\">\u003Ccircle cx=\"11\" cy=\"11\" r=\"8\">\u003C/circle>\u003Cline x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\">\u003C/line>\u003C/svg>Ingrandisci foto\u003C/span>\n              \u003C/div>\n            \u003C/div>\n\n            \u003Csc-if value=\"{{ cls.hasGallery }}\" hint-placeholder-val=\"{{ true }}\">\n              \u003Cdiv class=\"photos-card\" style=\"padding:22px 26px 26px;\">\n                \u003Cdiv style=\"font-family:'Oswald',sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#A8966f;margin-bottom:16px;\">Altre foto della classe\u003C/div>\n                \u003Cdiv style=\"{{ cls.gridStyle }}\">\n                  \u003Csc-for list=\"{{ cls.galleryPhotos }}\" as=\"ph\" hint-placeholder-count=\"6\">\n                    \u003Cdiv tabindex=\"0\" role=\"button\" aria-label=\"{{ ph.alt }}\" onclick=\"{{ ph.open }}\" onkeydown=\"{{ ph.onKey }}\" style=\"border-radius:10px;overflow:hidden;cursor:pointer;background:#F0E7D4;position:relative;transition:transform .2s,box-shadow .2s;\" style-hover=\"transform:translateY(-5px);box-shadow:0 12px 26px rgba(17,38,74,.18);\">\n                      \u003Cimg src=\"{{ ph.src }}\" alt=\"{{ ph.alt }}\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/2;object-fit:contain;display:block;\">\n                    \u003C/div>\n                  \u003C/sc-for>\n                \u003C/div>\n              \u003C/div>\n            \u003C/sc-if>\n          \u003C/section>\n        \u003C/sc-for>\n      \u003C/sc-for>\n\n      \u003Csc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n        \u003Cdiv style=\"text-align:center;padding:80px 20px;color:#8a7a5e;\">\n          \u003Cdiv style=\"font-family:'Oswald',sans-serif;font-size:24px;text-transform:uppercase;color:#17335D;\">Nessun risultato\u003C/div>\n          \u003Cp style=\"margin-top:8px;font-size:15px;\">Prova un altro nome di classe.\u003C/p>\n        \u003C/div>\n      \u003C/sc-if>\n\n      \u003C!-- FOTO EXTRA -->\n      \u003Cdiv id=\"extra-photos\" style=\"scroll-margin-top:24px;\">\n        \u003Cdiv style=\"display:flex;align-items:center;gap:16px;margin:48px 0 26px;\">\n          \u003Cspan style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;text-transform:uppercase;color:#17335D;white-space:nowrap;\">Foto Extra\u003C/span>\n          \u003Cspan style=\"flex:1;height:2px;background:repeating-linear-gradient(to right,#E3D6BF 0 8px,transparent 8px 14px);\">\u003C/span>\n          \u003Cspan style=\"font-family:'Oswald',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#A8966f;\">{{ extraCountLabel }}\u003C/span>\n        \u003C/div>\n        \u003Csection class=\"photos-card\" style=\"background:#FFFFFF;border:1px solid #E3D6BF;border-radius:14px;box-shadow:0 4px 18px rgba(17,38,74,.07);overflow:hidden;margin-bottom:36px;padding:22px 26px 26px;\">\n          \u003Cdiv style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;\">\n            \u003Csc-for list=\"{{ extraPhotos }}\" as=\"ph\" hint-placeholder-count=\"6\">\n              \u003Cdiv tabindex=\"0\" role=\"button\" aria-label=\"{{ ph.alt }}\" onclick=\"{{ ph.open }}\" onkeydown=\"{{ ph.onKey }}\" style=\"border-radius:10px;overflow:hidden;cursor:pointer;background:#F0E7D4;position:relative;transition:transform .2s,box-shadow .2s;\" style-hover=\"transform:translateY(-5px);box-shadow:0 12px 26px rgba(17,38,74,.18);\">\n                \u003Cimg src=\"{{ ph.src }}\" alt=\"{{ ph.alt }}\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/2;object-fit:contain;display:block;\">\n              \u003C/div>\n            \u003C/sc-for>\n          \u003C/div>\n        \u003C/section>\n      \u003C/div>\n\n      \u003C!-- ULTIMO GIORNO -->\n      \u003Cdiv id=\"last-day-photos\" style=\"scroll-margin-top:24px;\">\n        \u003Cdiv style=\"display:flex;align-items:center;gap:16px;margin:48px 0 26px;\">\n          \u003Cspan style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;text-transform:uppercase;color:#17335D;white-space:nowrap;\">Ultimo Giorno\u003C/span>\n          \u003Cspan style=\"flex:1;height:2px;background:repeating-linear-gradient(to right,#E3D6BF 0 8px,transparent 8px 14px);\">\u003C/span>\n          \u003Cspan style=\"font-family:'Oswald',sans-serif;font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#A8966f;\">{{ lastDayCountLabel }}\u003C/span>\n        \u003C/div>\n        \u003Csection class=\"photos-card\" style=\"background:#FFFFFF;border:1px solid #E3D6BF;border-radius:14px;box-shadow:0 4px 18px rgba(17,38,74,.07);overflow:hidden;margin-bottom:36px;padding:22px 26px 26px;\">\n          \u003Cdiv style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;\">\n            \u003Csc-for list=\"{{ lastDayPhotos }}\" as=\"ph\" hint-placeholder-count=\"6\">\n              \u003Cdiv tabindex=\"0\" role=\"button\" aria-label=\"{{ ph.alt }}\" onclick=\"{{ ph.open }}\" onkeydown=\"{{ ph.onKey }}\" style=\"border-radius:10px;overflow:hidden;cursor:pointer;background:#F0E7D4;position:relative;transition:transform .2s,box-shadow .2s;\" style-hover=\"transform:translateY(-5px);box-shadow:0 12px 26px rgba(17,38,74,.18);\">\n                \u003Cimg src=\"{{ ph.src }}\" alt=\"{{ ph.alt }}\" loading=\"lazy\" style=\"width:100%;aspect-ratio:3/2;object-fit:contain;display:block;\">\n              \u003C/div>\n            \u003C/sc-for>\n          \u003C/div>\n        \u003C/section>\n      \u003C/div>\n    \u003C/div>\n\n    \u003C!-- FOOTER -->\n    \u003Cfooter class=\"footer-wrap\" style=\"margin-top:72px;padding:0 56px;\">\n      \u003Cdiv class=\"footer-cta\" style=\"position:relative;overflow:hidden;background:linear-gradient(135deg,#11264A,#21437a);border-radius:16px;padding:48px 52px;display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;\">\n        \u003Cdiv style=\"position:absolute;right:34px;top:-30px;font-family:'Oswald',sans-serif;font-size:170px;font-weight:700;color:rgba(197,39,36,.14);line-height:1;pointer-events:none;\">★\u003C/div>\n        \u003Cdiv style=\"position:relative;\">\n          \u003Ch3 style=\"font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;text-transform:uppercase;color:#FAF3E6;margin:0 0 8px;\">Pronta per la stampa\u003C/h3>\n          \u003Cp style=\"font-size:14px;color:#B9C5DA;max-width:420px;margin:0;\">Scarica l'archivio completo con tutte le immagini ad alta risoluzione, organizzate per classe. File pronti per la copisteria.\u003C/p>\n        \u003C/div>\n        \u003Cbutton onclick=\"{{ download }}\" style=\"position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:11px;background:#C52724;color:#FAF3E6;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase;padding:15px 28px;border:none;border-radius:999px;cursor:pointer;box-shadow:0 6px 22px rgba(197,39,36,.4);transition:transform .18s,background .18s;\" style-hover=\"background:#A41E1C;transform:translateY(-2px);\">\n          \u003Cdiv style=\"{{ downloadBarStyle }}\">\u003C/div>\n          \u003Csvg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"position:relative;\">\u003Cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\">\u003C/path>\u003Cpolyline points=\"7 10 12 15 17 10\">\u003C/polyline>\u003Cline x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\">\u003C/line>\u003C/svg>\n          \u003Cspan style=\"position:relative;\">{{ downloadLabel }}\u003C/span>\n        \u003C/button>\n      \u003C/div>\n      \u003Cdiv style=\"padding:26px 0 38px;text-align:center;font-size:12.5px;color:#A8966f;\">© {{ year }} — Annuario Scolastico {{ schoolName }}. Tutti i diritti riservati.\u003C/div>\n    \u003C/footer>\n  \u003C/main>\n\n  \u003C!-- ══════════ BACK TO TOP ══════════ -->\n  \u003Cbutton onclick=\"{{ backToTop }}\" aria-label=\"Torna su\" style=\"{{ backToTopStyle }}\" style-hover=\"background:#21437a;transform:translateY(-2px);\">\n    \u003Csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003Cline x1=\"12\" y1=\"19\" x2=\"12\" y2=\"5\">\u003C/line>\u003Cpolyline points=\"5 12 12 5 19 12\">\u003C/polyline>\u003C/svg>\n  \u003C/button>\n\n  \u003C!-- ══════════ LIGHTBOX ══════════ -->\n  \u003Csc-if value=\"{{ lightbox.open }}\" hint-placeholder-val=\"{{ false }}\">\n    \u003Cdiv onclick=\"{{ closeLightbox }}\" style=\"position:fixed;inset:0;z-index:1000;background:rgba(11,24,46,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;\">\n      \u003Cbutton onclick=\"{{ closeLightbox }}\" aria-label=\"Chiudi\" style=\"position:fixed;top:22px;right:28px;width:42px;height:42px;border-radius:50%;background:rgba(242,229,210,.12);border:1px solid rgba(242,229,210,.2);color:#FAF3E6;cursor:pointer;display:flex;align-items:center;justify-content:center;\" style-hover=\"background:rgba(242,229,210,.22);\">\n        \u003Csvg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003Cline x1=\"1\" y1=\"1\" x2=\"13\" y2=\"13\">\u003C/line>\u003Cline x1=\"13\" y1=\"1\" x2=\"1\" y2=\"13\">\u003C/line>\u003C/svg>\n      \u003C/button>\n      \u003Cdiv onclick=\"{{ stop }}\" style=\"display:flex;flex-direction:column;align-items:center;animation:lbIn .25s cubic-bezier(.25,.46,.45,.94);\">\n        {{ lightboxImg }}\n        \u003Cp style=\"color:#C9B68f;margin:16px 0 0;font-size:14px;font-weight:500;\">{{ lightbox.caption }}\u003C/p>\n      \u003C/div>\n    \u003C/div>\n  \u003C/sc-if>\n\n\u003C/div>\n\u003C/x-dc>\n\u003Cscript type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:860},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C52724&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#C52724&quot;,&quot;#17335D&quot;,&quot;#A8966f&quot;]},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Comodo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;Comodo&quot;,&quot;Compatto&quot;]}}\">\nclass Component extends DCLogic {\n  state = { query: \"\", activeId: null, lightbox: { open: false, src: \"\", caption: \"\" }, downloading: false, downloadProgress: 0, showBackToTop: false };\n\n  config = { schoolName: \"Istituto «C. Cattaneo»\", schoolYear: \"2025/2026\" };\n\n  ph(w, h, txt, bg) { return `https://placehold.co/${w}x${h}/${bg || \"17335d\"}/f2e5d2?text=${encodeURIComponent(txt)}`; }\n\n  storageBase() { return \"https://gxskimhiftdozolxxavh.supabase.co/storage/v1/object/public/annuario2/\"; }\n  pad(n, len) { return String(n).padStart(len, \"0\"); }\n\n  data() {\n    if (this._data) return this._data;\n    const base = this.storageBase();\n    const counts = [\n      [\"1A\", 9], [\"1B\", 4], [\"1C\", 2], [\"1G\", 0], [\"1H\", 3],\n      [\"2A\", 2], [\"2B\", 4], [\"2C\", 3], [\"2F\", 0], [\"2G\", 2], [\"2H\", 1],\n      [\"3A\", 3], [\"3B\", 4], [\"3C\", 4], [\"3G\", 2], [\"3H\", 3],\n      [\"4A\", 9], [\"4B\", 2], [\"4C\", 1], [\"4G\", 3], [\"4H\", 5], [\"4I\", 9],\n      [\"5A\", 12], [\"5B\", 8], [\"5C\", 9], [\"5G\", 10], [\"5H\", 3],\n    ];\n    this._data = counts.map(([id, galleryCount]) => {\n      const label = id[0] + \"ª \" + id.slice(1);\n      const year = parseInt(id[0], 10);\n      const heroPhoto = { src: base + \"classi/\" + id + \"/hero.jpg\", alt: \"Foto classe \" + label };\n      const galleryPhotos = Array.from({ length: galleryCount }, (_, i) => ({\n        src: base + \"classi/\" + id + \"/g\" + this.pad(i + 1, 2) + \".jpg\",\n        alt: \"Foto classe \" + label,\n      }));\n      return {\n        id, label, year,\n        photos: [heroPhoto, ...galleryPhotos],\n        heroPhoto,\n        galleryPhotos,\n      };\n    });\n    return this._data;\n  }\n\n  extraPhotosData() {\n    if (this._extra) return this._extra;\n    const base = this.storageBase();\n    this._extra = Array.from({ length: 119 }, (_, i) => ({\n      alt: \"Foto extra \" + (i + 1),\n      src: base + \"extra/\" + this.pad(i + 1, 3) + \".jpg\",\n    }));\n    return this._extra;\n  }\n\n  lastDayData() {\n    if (this._lastDay) return this._lastDay;\n    const base = this.storageBase();\n    this._lastDay = Array.from({ length: 90 }, (_, i) => ({\n      alt: \"Ultimo giorno \" + (i + 1),\n      src: base + \"ultimo-giorno/\" + this.pad(i + 1, 3) + \".jpg\",\n    }));\n    return this._lastDay;\n  }\n\n  scrollTo(id) {\n    const el = document.getElementById(id);\n    if (!el) return;\n    const top = el.getBoundingClientRect().top + window.scrollY - 20;\n    window.scrollTo({ top, behavior: \"smooth\" });\n  }\n\n  openLightbox(src, caption) { this.setState({ lightbox: { open: true, src, caption } }); document.body.style.overflow = \"hidden\"; }\n  closeLightbox = () => { this.setState({ lightbox: { open: false, src: \"\", caption: \"\" } }); document.body.style.overflow = \"\"; };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => {\n        this._raf = null;\n        const secs = this.data().map(d => document.getElementById(d.id)).filter(Boolean);\n        let cur = null;\n        for (const s of secs) { if (s.getBoundingClientRect().top \u003C= 120) cur = s.id; }\n        if (cur && cur !== this.state.activeId) this.setState({ activeId: cur });\n        const shouldShow = window.scrollY > 700;\n        if (shouldShow !== this.state.showBackToTop) this.setState({ showBackToTop: shouldShow });\n      });\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n    this._key = (e) => { if (e.key === \"Escape\") this.closeLightbox(); };\n    window.addEventListener(\"keydown\", this._key);\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this._onScroll);\n    window.removeEventListener(\"keydown\", this._key);\n  }\n\n  async download() {\n    if (this.state.downloading || !window.JSZip) return;\n    const total = this.data().reduce((n, cl) => n + cl.photos.length, 0) || 1;\n    let done = 0;\n    this.setState({ downloading: true, downloadProgress: 0 });\n    try {\n      const zip = new window.JSZip();\n      for (const cl of this.data()) {\n        const folder = zip.folder(\"Classe_\" + cl.id);\n        for (let i = 0; i \u003C cl.photos.length; i++) {\n          await this.addToZip(folder, cl.photos[i].src, `classe_${cl.id}_${this.pad(i + 1, 2)}.jpg`);\n          done++;\n          this.setState({ downloadProgress: Math.round((done / total) * 90) });\n        }\n      }\n      const blob = await zip.generateAsync({ type: \"blob\" }, (meta) => {\n        this.setState({ downloadProgress: 90 + Math.round(meta.percent * 0.1) });\n      });\n      this.setState({ downloadProgress: 100 });\n      const url = URL.createObjectURL(blob);\n      const a = Object.assign(document.createElement(\"a\"), { href: url, download: `Annuario_${this.config.schoolYear.replace(\"/\", \"_\")}_stampa.zip` });\n      a.click();\n      URL.revokeObjectURL(url);\n    } catch (e) { alert(\"Errore: \" + e.message); }\n    finally { this.setState({ downloading: false, downloadProgress: 0 }); }\n  }\n  async addToZip(folder, src, filename) {\n    try { const r = await fetch(src); if (!r.ok) throw new Error(); folder.file(filename, await r.blob()); }\n    catch { folder.file(filename + \".txt\", \"Non disponibile: \" + src); }\n  }\n\n  renderVals() {\n    const accent = this.props.accentColor ?? \"#C52724\";\n    const minCol = this.props.density === \"Compatto\" ? 104 : 132;\n    const q = (this.state.query || \"\").trim().toLowerCase();\n    const all = this.data();\n\n    const matchClass = (cl) => {\n      if (!q) return cl;\n      const labelHit = (\"classe \" + cl.label).toLowerCase().includes(q) || cl.id.toLowerCase().includes(q);\n      return labelHit ? cl : null;\n    };\n\n    const groups = {};\n    all.forEach(cl => { const m = matchClass(cl); if (m) (groups[cl.year] = groups[cl.year] || []).push(m); });\n\n    const navGroups = Object.keys(groups).sort((a, b) => a - b).map(year => ({\n      yearLabel: year + \"° Anno\",\n      countLabel: groups[year].length + (groups[year].length === 1 ? \" classe\" : \" classi\"),\n      classes: groups[year].map(cl => {\n        const active = this.state.activeId === cl.id;\n        const navBase = \"display:flex;align-items:center;gap:10px;padding:9px 24px;font-size:13.5px;font-weight:500;text-decoration:none;border-left:3px solid transparent;transition:all .16s;\";\n        return {\n          ...cl,\n          href: \"#\" + cl.id,\n          section: cl.id.slice(-1),\n          yearLabel: cl.year + \"° Anno\",\n          count: cl.photos.length,\n          sub: cl.photos.length + \" foto · A.S. \" + this.config.schoolYear,\n          gridStyle: `display:grid;grid-template-columns:repeat(auto-fill,minmax(${minCol}px,1fr));gap:14px;`,\n          navStyle: navBase + (active\n            ? `color:#FAF3E6;background:rgba(242,229,210,.09);border-left-color:${accent};font-weight:600;`\n            : \"color:rgba(242,229,210,.62);\"),\n          dotStyle: `width:6px;height:6px;border-radius:50%;flex-shrink:0;background:${active ? accent : \"rgba(242,229,210,.28)\"};`,\n          countStyle: `font-size:11px;padding:2px 8px;border-radius:999px;background:${active ? \"rgba(197,39,36,.22)\" : \"rgba(242,229,210,.1)\"};color:${active ? \"#E89B98\" : \"rgba(242,229,210,.5)\"};`,\n          goto: (e) => { e.preventDefault(); this.setState({ activeId: cl.id }); this.scrollTo(cl.id); },\n          openHero: () => this.openLightbox(cl.heroPhoto.src, \"Foto classe \" + cl.label),\n          hasGallery: cl.galleryPhotos.length > 0,\n          galleryPhotos: cl.galleryPhotos.map(s => ({\n            ...s,\n            open: () => this.openLightbox(s.src, s.alt),\n            onKey: (e) => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); this.openLightbox(s.src, s.alt); } },\n          })),\n        };\n      }),\n    }));\n\n    const totalPhotos = all.reduce((n, c) => n + c.photos.length, 0);\n    const years = new Set(all.map(c => c.year)).size;\n\n    const extraPhotos = this.extraPhotosData().map(p => ({\n      ...p,\n      open: () => this.openLightbox(p.src, p.alt),\n      onKey: (e) => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); this.openLightbox(p.src, p.alt); } },\n    }));\n\n    const lastDayPhotos = this.lastDayData().map(p => ({\n      ...p,\n      open: () => this.openLightbox(p.src, p.alt),\n      onKey: (e) => { if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); this.openLightbox(p.src, p.alt); } },\n    }));\n\n    return {\n      schoolName: this.config.schoolName,\n      schoolYear: this.config.schoolYear,\n      year: new Date().getFullYear(),\n      query: this.state.query,\n      onSearch: (e) => this.setState({ query: e.target.value }),\n      noResults: navGroups.length === 0,\n      navGroups,\n      stats: [\n        { value: all.length, label: \"Classi\" },\n        { value: totalPhotos, label: \"Foto\" },\n        { value: years, label: \"Anni di corso\" },\n      ],\n      extraPhotos,\n      extraCountLabel: extraPhotos.length + (extraPhotos.length === 1 ? \" foto\" : \" foto\"),\n      gotoExtra: () => this.scrollTo(\"extra-photos\"),\n      lastDayPhotos,\n      lastDayCountLabel: lastDayPhotos.length + (lastDayPhotos.length === 1 ? \" foto\" : \" foto\"),\n      gotoLastDay: () => this.scrollTo(\"last-day-photos\"),\n      lightbox: this.state.lightbox,\n      lightboxImg: React.createElement(\"img\", { src: this.state.lightbox.src, alt: this.state.lightbox.caption, style: { maxWidth: \"86vw\", maxHeight: \"78vh\", borderRadius: \"12px\", boxShadow: \"0 24px 80px rgba(0,0,0,.6)\", display: \"block\" } }),\n      closeLightbox: this.closeLightbox,\n      stop: (e) => e.stopPropagation(),\n      download: () => this.download(),\n      gotoClass: (e) => { var href = e.target.value; if(href){ window.location.hash = href.replace(/^#/,\"\"); e.target.value=\"\"; } },\n      downloadLabel: this.state.downloading ? `Preparazione… ${this.state.downloadProgress}%` : \"Scarica per la stampa\",\n      toolbarDownloadLabel: this.state.downloading ? `Preparazione… ${this.state.downloadProgress}%` : \"Scarica l'annuario\",\n      downloadBarStyle: `position:absolute;left:0;top:0;bottom:0;width:${this.state.downloading ? this.state.downloadProgress : 0}%;background:rgba(255,255,255,.28);transition:width .2s ease;pointer-events:none;`,\n      backToTop: () => window.scrollTo({ top: 0, behavior: \"smooth\" }),\n      backToTopStyle: `position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:50%;background:#17335D;border:1px solid rgba(242,229,210,.25);color:#FAF3E6;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(17,38,74,.35);z-index:50;transition:opacity .2s,transform .2s;` + (this.state.showBackToTop ? \"opacity:1;pointer-events:auto;\" : \"opacity:0;pointer-events:none;transform:translateY(8px);\"),\n    };\n  }\n}\n\u003C/script>\n\n\n\u003Cscript>\n(function(){\n  document.addEventListener('click', function(e){\n    var d = document.getElementById('cls-picker');\n    if(d && !d.contains(e.target)) d.removeAttribute('open');\n  });\n  document.addEventListener('click', function(e){\n    if(e.target.closest && e.target.closest('.cls-lnk')){\n      setTimeout(function(){\n        var d = document.getElementById('cls-picker');\n        if(d) d.removeAttribute('open');\n      }, 80);\n    }\n  });\n})();\n\u003C/script>\n\u003C/body>\u003C/html>"
  </script>
